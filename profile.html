<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Noto+Serif+KR:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060a;--ink:#f0e9df;--muted:#9d949d;--gold:#c9a45d;--gold2:#735321;--line:rgba(201,164,93,.2)}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 72% 10%,rgba(118,21,38,.16),transparent 30%),linear-gradient(180deg,#06050a,#0a080d 60%,#060509);font-family:"Noto Serif KR",serif}a{color:inherit;text-decoration:none}.top{height:4px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}main{width:min(1120px,calc(100% - 40px));margin:auto;padding:30px 0 70px}.bar{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}.brand{font:700 16px "Cinzel";letter-spacing:.12em}.back{font:500 10px "DM Mono";letter-spacing:.1em;color:#b4aab1}.back:hover{color:var(--gold)}.profile{margin-top:38px;border:1px solid var(--line);display:grid;grid-template-columns:.82fr 1.18fr;min-height:600px;background:#0d0a10}.visual{min-height:450px;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(118,21,38,.22),transparent 50%),#0c090f}.visual:before,.visual:after{content:"";position:absolute;border:1px solid rgba(201,164,90,.15);border-radius:50%}.visual:before{width:72%;aspect-ratio:1}.visual:after{width:52%;aspect-ratio:1;border-color:rgba(118,21,38,.2)}.profile-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;z-index:1;padding:18px;filter:saturate(.9) contrast(1.03)}.visual:after{z-index:2}.visual:before{z-index:2}.sigil{width:120px;height:120px;border:1px solid var(--gold2);display:grid;place-items:center;transform:rotate(45deg);z-index:2}.sigil span{transform:rotate(-45deg);font:700 35px "Cinzel";color:var(--gold)}.info{padding:50px}.code{color:var(--gold);font:500 10px "DM Mono";letter-spacing:.13em}.info h1{margin:17px 0 4px;font:800 clamp(48px,8vw,88px)/.95 "Noto Serif KR";letter-spacing:-.08em}.en{color:#aaa0aa;font:600 15px "Cinzel";letter-spacing:.23em}.role{margin-top:14px;color:#d2c7cf;font-size:14px}.rule{width:90px;height:1px;margin:26px 0;background:linear-gradient(90deg,var(--gold),transparent)}.quote{margin:0 0 24px;padding:18px;border-left:2px solid var(--gold);background:#0b090e;color:#d2c5b8;font-size:15px;line-height:1.8}.section-label{color:var(--gold);font:500 9px "DM Mono";letter-spacing:.12em}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.fact{padding:15px;border:1px solid rgba(201,164,93,.12);background:#0c0a0f}.fact b{display:block;color:#7e747d;font:500 9px "DM Mono";letter-spacing:.1em;margin-bottom:6px}.fact span{font-size:11px;line-height:1.7}.bio{margin-top:21px;color:#aaa0aa;font-size:12px;line-height:1.8}.selector{margin-top:26px;display:flex;gap:9px;flex-wrap:wrap}select,.navbtn{padding:11px 12px;border:1px solid var(--gold2);background:#0b090e;color:var(--ink);font:500 10px "DM Mono";letter-spacing:.05em}.navbtn:hover{background:var(--gold);color:#100c0f}@media(max-width:760px){.profile{grid-template-columns:1fr}.visual{min-height:350px}.info{padding:30px 24px}.facts{grid-template-columns:1fr}}

.audio-player{position:fixed;right:22px;bottom:22px;z-index:1000;width:min(360px,calc(100% - 28px));padding:14px 15px;border:1px solid rgba(201,164,93,.35);background:rgba(7,6,10,.94);backdrop-filter:blur(12px);box-shadow:0 12px 45px rgba(0,0,0,.45)}
.audio-top{display:flex;align-items:center;gap:12px}.audio-disc{width:34px;height:34px;border:1px solid #735321;border-radius:50%;display:grid;place-items:center;color:#c9a45d;font:700 12px "Cinzel";flex:0 0 auto}.audio-meta{min-width:0;flex:1}.audio-label{color:#c9a45d;font:500 8px "DM Mono";letter-spacing:.14em}.audio-title{margin-top:4px;color:#e9e0d8;font:600 11px "Noto Serif KR";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.audio-btn{border:1px solid #735321;background:#0b090e;color:#c9a45d;padding:9px 11px;cursor:pointer;font:500 9px "DM Mono";letter-spacing:.08em}.audio-btn:hover{background:#c9a45d;color:#100c0f}.audio-bottom{display:flex;align-items:center;gap:10px;margin-top:10px}.audio-progress{flex:1;height:2px;appearance:none;background:#2b2428;cursor:pointer}.audio-progress::-webkit-slider-thumb{appearance:none;width:9px;height:9px;border-radius:50%;background:#c9a45d}.audio-time{color:#837983;font:500 8px "DM Mono";min-width:65px;text-align:right}
@media(max-width:760px){.audio-player{right:14px;bottom:14px;width:calc(100% - 28px)}}

</style></head>
<body>

<div class="top"></div><main><div class="bar"><div class="brand">SEVEN SINS / 칠죄종</div><a class="back" href="index.html#sins">← BACK TO THE CAST</a></div>
<section class="profile"><div class="visual"><img class="profile-art" id="profileArt" src="캐마.png" alt="김캐마 일러스트"><div class="sigil"><span id="sigil">VII</span></div></div>
<div class="info"><div class="code" id="code">SIN / 01</div><h1 id="name">김캐마</h1><div class="en" id="en">ENVY</div><div class="role" id="role">조직의 메디컬</div><div class="rule"></div>

<p class="bio" id="feature"></p><div class="selector"><select id="memberSelect"><option value="캐마">김캐마 · 질투</option><option value="대부기">대부기 · 분노</option><option value="향단">문향단 · 탐욕</option><option value="정잭">이정잭 · 오만</option><option value="아랑">아랑 · 색욕</option><option value="우현">우현 · 식욕</option><option value="개">개 · 나태</option></select><a class="navbtn" id="prev" href="#">← PREV</a><a class="navbtn" id="next" href="#">NEXT →</a></div>
</div></section></main>
<script>
const members={"캐마": {"key": "캐마", "name": "김캐마", "role": "조직의 메디컬", "sin": "질투", "en": "ENVY", "symbol": "뱀 / 시든 꽃", "weapon": "쇠로 된 주사기", "feature": "승부보단 권위를, 권위보단 인정을, 인정보단 만족을.", "title": "질투에 눈 먼 메딕", "appearance": "허리까지 내려오는 긴 갈색 장발, 초록색 눈동자", "quote": "음~ 눈이 참예쁘군요. 짜증나게… 그럼, 잘 받아갈게요?", "skills": "독극물과 응급 처치에 능하며 차분한 말투 속에 질투와 집착이 서려 있는 메디컬."}, "대부기": {"key": "대부기", "name": "대부기", "role": "행동대장", "sin": "분노", "en": "WRATH", "symbol": "곰 / 지포라이터", "weapon": "두 개의 금색 데저트 이글", "feature": "불안정한 감정의 진폭은 깔끔하게 폭력으로, 속에 들끓는 분노는 파괴로.", "title": "지나치게 투명한 솔직한 행동대장", "appearance": "앞으로 내린 뾰족한 붉은 머리, 붉은 눈동자, 날카롭게 찢어진 눈매", "quote": "아, 씨... 수트에 구김 갔잖아. 하... 성질 올라오게 하네.", "skills": "현장 제압과 돌입을 담당하며 감정을 숨기지 않는 직선적인 행동대장."}, "향단": {"key": "향단", "name": "문향단", "role": "정보상", "sin": "탐욕", "en": "GREED", "symbol": "독수리 / 외알 안경", "weapon": "검은색 카람빗", "feature": "원하는 걸 손에 넣었음에도 만족보단 다음을.", "title": "가장 탐욕스러운 정보상", "appearance": "체리레드 색의 머리카락, 어깨까지 오는 중단발 반묶음, 비녀로 고정, 금색 눈동자, 짙은 아이홀, 뚜렷한 T존, 적당히 혈색이 도는 흰 피부, 탄탄하게 붙은 실압근", "quote": "가치를 몰라도 너무 모르는 것 아니야, 달링?", "skills": "정보를 가치로 환산하고 원하는 것을 수집하는 협상형 정보상."}, "정잭": {"key": "정잭", "name": "이정잭", "role": "조직의 수장", "sin": "오만", "en": "PRIDE", "symbol": "호랑이 / 왕관", "weapon": "은색 너클", "feature": "무엇이든 발 아래에, 그게 설령 창조주일지라도.", "title": "가장 오만한 리더", "appearance": "다부진 체형, 살짝 구릿빛 피부, 넘긴 적색 머리, 붉은 눈동자, 무쌍의 날카로운 눈매, 오른쪽 눈에 난 세로로 꿰맨 상처", "quote": "때론 과욕이 화를 부르는 법일세. 안타깝게 됐군, 자네에게는.", "skills": "조직 전체를 지휘하며 믹싱, 노래, 경남 사투리를 담당하는 수장."}, "아랑": {"key": "아랑", "name": "아랑", "role": "협상가", "sin": "색욕", "en": "LUST", "symbol": "공작 / 향수", "weapon": "은색 콜트 파이슨 리볼버", "feature": "때론 실체보단 미미하게 남은 한줄기의 잔향이 더 끌리는 법.", "title": "지독하게 매혹적인 협상가", "appearance": "창백한 피부, 글래머러스한 체형, 엉덩이까지 내려오는 긴 백발, 백안, 흰 눈썹과 속눈썹, 눈가와 입술이 붉음", "quote": "이건 협박이란다. 살고 싶으면 기어 봐. 자기야.", "skills": "아지트, 대본, 노래를 담당하며 말과 분위기로 상대를 압박하는 협상가."}, "우현": {"key": "우현", "name": "우현", "role": "현장 처리 담당", "sin": "식욕", "en": "GLUTTONY", "symbol": "악어 / 성배", "weapon": "보라색 카타나", "feature": "총족도, 체면도, 권위도 지독한 갈증과 허기 앞에선 힘을 잃는 법.", "title": "끝없는 허기에 허덕이는 처리반", "appearance": "흑발, 검은색 고양이 귀, 보라색 눈동자, 고양이 같은 세로 동공, 밝은 피부, 슬랜더 체형, 왼쪽 귓볼의 검은색 피어싱", "quote": "아, 고기는 남겨 둬. 꽤나 신선해 보이니까.", "skills": "믹싱과 일본어 번역을 담당하며 현장을 처리하는 실무형 멤버."}, "개": {"key": "개", "name": "개", "role": "해커이자 ‘마스코트 막내 공주’", "sin": "나태", "en": "SLOTH", "symbol": "고양이 / 멈춘 모래 시계", "weapon": "노트북", "feature": "때론 시작조차 않는 것도 효율적인 나태의 소비방식이 되는 법. 모순적인 완벽주의.", "title": "나태한 해커", "appearance": "허리까지 내려오는 살짝 곱슬거리는 금발, 회색 눈동자, 강아지 귀, 검은색 보석이 박힌 티아라, 골드 블랙 반클리프 목걸이", "quote": "그럼 굿나잇.", "skills": "경북 사투리, 영어 번역, 중국어 표준어를 담당하며 필요한 순간에만 움직이는 해커."}};
const keys=["캐마", "대부기", "향단", "정잭", "아랑", "우현", "개"];
const images={"캐마":"캐마.png","대부기":"대부기.png","향단":"향단.png","정잭":"정잭.png","아랑":"아랑.png","우현":"우현.png","개":"개.png"};
const key=new URLSearchParams(location.search).get("member")||keys[0];
const index=Math.max(0,keys.indexOf(key));
const m=members[keys[index]];
document.title="칠죄종 — "+m.name;
document.getElementById("code").textContent="SIN / "+String(index+1).padStart(2,"0");
document.getElementById("name").textContent=m.name;
document.getElementById("en").textContent=m.en;
document.getElementById("role").textContent=m.role;
document.getElementById("quote").textContent="“"+m.quote+"”";
document.getElementById("sin").textContent=m.sin;
document.getElementById("symbol").textContent=m.symbol;
document.getElementById("weapon").textContent=m.weapon;
document.getElementById("title").textContent=m.title;
document.getElementById("appearance").textContent=m.appearance;
document.getElementById("skills").textContent=m.skills;
document.getElementById("feature").textContent=m.feature;
document.getElementById("sigil").textContent=m.en[0];
const art=document.getElementById("profileArt"); art.src=images[keys[index]]; art.alt=m.name+" 일러스트";
const select=document.getElementById("memberSelect");select.value=keys[index];select.addEventListener("change",()=>location.href="profile.html?member="+encodeURIComponent(select.value));
document.getElementById("prev").href="profile.html?member="+encodeURIComponent(keys[(index-1+keys.length)%keys.length]);
document.getElementById("next").href="profile.html?member="+encodeURIComponent(keys[(index+1)%keys.length]);
</script>
<script>
(function(){
  const audio=document.getElementById("siteAudio"), btn=document.getElementById("audioToggle");
  const progress=document.getElementById("audioProgress"), time=document.getElementById("audioTime");
  const stateKey="sevenSinsAudioState";
  function fmt(sec){if(!isFinite(sec)) return "0:00"; const m=Math.floor(sec/60), s=Math.floor(sec%60); return m+":"+String(s).padStart(2,"0")}
  function update(){progress.value=audio.duration?((audio.currentTime/audio.duration)*100):0; time.textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration); btn.textContent=audio.paused?"PLAY":"PAUSE";}
  audio.addEventListener("loadedmetadata",function(){
    try{const saved=JSON.parse(localStorage.getItem(stateKey)||"{}"); if(saved.time && saved.time<audio.duration) audio.currentTime=saved.time;}catch(e){}
    update();
  });
  audio.addEventListener("timeupdate",function(){
    update();
    if(Math.floor(audio.currentTime)%3===0){try{localStorage.setItem(stateKey,JSON.stringify({time:audio.currentTime,playing:!audio.paused}))}catch(e){}}
  });
  audio.addEventListener("play",function(){btn.textContent="PAUSE";try{localStorage.setItem(stateKey,JSON.stringify({time:audio.currentTime,playing:true}))}catch(e){}});
  audio.addEventListener("pause",function(){btn.textContent="PLAY";try{localStorage.setItem(stateKey,JSON.stringify({time:audio.currentTime,playing:false}))}catch(e){}});
  btn.addEventListener("click",function(){if(audio.paused){audio.play().catch(()=>{});}else audio.pause();});
  progress.addEventListener("input",function(){if(audio.duration) audio.currentTime=(Number(progress.value)/100)*audio.duration;});
  document.addEventListener("visibilitychange",function(){if(document.hidden){try{localStorage.setItem(stateKey,JSON.stringify({time:audio.currentTime,playing:!audio.paused}))}catch(e){}}});
  audio.addEventListener("canplay",function(){
    try{
      const saved=JSON.parse(localStorage.getItem(stateKey)||"{}");
      if(saved.playing) audio.play().catch(()=>{});
      else audio.play().catch(()=>{});
    }catch(e){audio.play().catch(()=>{});}
  },{once:true});
  update();
})();
</script>
</body></html>
